[build]
  command = "npm run build"
  publish = "dist"

  [build.environment]
    # Firebase web config values are not secret (they identify the project;
    # access is controlled by Firebase Security Rules) and are intentionally
    # inlined into the client bundle via Vite's VITE_ prefix, so skip them
    # in Netlify's secrets scan.
    SECRETS_SCAN_OMIT_KEYS = "VITE_FIREBASE_API_KEY,VITE_FIREBASE_AUTH_DOMAIN,VITE_FIREBASE_PROJECT_ID,VITE_FIREBASE_STORAGE_BUCKET,VITE_FIREBASE_MESSAGING_SENDER_ID,VITE_FIREBASE_APP_ID,VITE_FIREBASE_VAPID_KEY"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
